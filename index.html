
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O meu site</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #f5f5f5;
    }

    header {
      padding: 24px;
      border-bottom: 1px solid #333;
    }

    main {
      max-width: 850px;
      margin: 100px auto;
      padding: 24px;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 5rem);
      margin-bottom: 16px;
    }

    p {
      color: #bbb;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 20px;
      background: white;
      color: black;
      border-radius: 6px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    O MEU SITE
  </header>

  <main>
    <h1>Bem-vindo.</h1>
    <p>
      Este é o meu site, criado por mim
      e alojado no meu próprio computador.
    </p>
    <a href="mailto:contacto@example.com">
      Entrar em contacto
    </a>
  </main>
</body>
</html>
